---
layout: default
---
<article>
  <header class="article-header">
    <p class="eyebrow">Mathematical notes</p>
    <h1>{{ page.title | escape }}</h1>
    <p class="meta"><time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%B %-d, %Y' }}</time></p>
  </header>
  {{ content }}
</article>
