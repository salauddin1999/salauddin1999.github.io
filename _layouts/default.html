<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }} · {{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}">
  <link rel="stylesheet" href="{{ '/static/vim.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/static/style.css' | relative_url }}">
  <script defer src="{{ '/static/script.js' | relative_url }}"></script>
  <script defer src="{{ '/static/mathjax_macros.js' | relative_url }}"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <nav aria-label="Main navigation">
      <ul class="navbar">
        <li><a class="navbara" href="{{ '/index.html' | relative_url }}"{% if page.url == "/index.html" or page.url == "/" %} aria-current="page"{% endif %}>Home</a></li>
        <li><a class="navbara" href="{{ '/research.html' | relative_url }}"{% if page.url == "/research.html" %} aria-current="page"{% endif %}>Research</a></li>
        <li><a class="navbara" href="{{ '/blog.html' | relative_url }}"{% if page.url == "/blog.html" or page.layout == "blog" %} aria-current="page"{% endif %}>Notes &amp; Blog</a></li>
        <li><a class="navbara" href="{{ '/resources.html' | relative_url }}"{% if page.url == "/resources.html" %} aria-current="page"{% endif %}>Resources</a></li>
        <li><a class="navbara" href="{{ '/books.html' | relative_url }}"{% if page.url == "/books.html" %} aria-current="page"{% endif %}>Books</a></li>
        <li><a class="navbara" href="{{ '/about/' | relative_url }}"{% if page.url == "/about/" %} aria-current="page"{% endif %}>About</a></li>
        <li><a class="navbara" href="{{ '/contact.html' | relative_url }}"{% if page.url == "/contact.html" %} aria-current="page"{% endif %}>Contact</a></li>
      </ul>
    </nav>
  </header>
  <main id="main-content" class="page-content{% if page.home %} home-content{% endif %}" tabindex="-1">
    {{ content }}
  </main>
  {% include footer.html %}
  <button type="button" id="myBtn" aria-label="Back to top" hidden>↑</button>
</body>
</html>
